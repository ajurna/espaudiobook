name: espaudiobook

# Run it inside BookOrbit's compose project so `app` resolves inside the shared network:
#   docker compose -f docker-compose.yml -f /path/to/bookorbit/docker-compose.yml up -d
# Standalone (sidecar only): set BOOKORBIT_URL to the host BookOrbit is on, e.g. http://127.0.0.1:3000.
# The sidecar holds NO credential: the ESP32 owns its session and sends its Bearer token on every
# request, so the sidecar can only act while the device is asking. Put nginx (or your reverse proxy)
# in front of it - nginx terminates TLS, the sidecar stays plain http. Do this even on the LAN: the
# token rides in the URL for the audio stream, so plain http would leak it.
services:
  sidecar:
    image: ajurna/espaudiobook-sidecar:0.1.7
    container_name: espaudiobook-sidecar
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      BOOKORBIT_URL: ${BOOKORBIT_URL:-http://app:3000}
      CACHE_DIR: /cache
      PORT: 8090
      TZ: ${TZ:-UTC}
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-200000000}
    ports:
      - "${SIDECAR_PORT:-8090}:8090"
    volumes:
      - ./data/sidecar:/cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
